<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Kebab Tycoon</title>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <script type="module" crossorigin src="./assets/index-BViKgWgM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-7i6IjX9x.css">
  </head>
  <body>
    <canvas id="game"></canvas>

    <!--
      The icon set. The painted pictures (coin, doner, customer...) are added here as symbols by
      src/ui/icons.ts when the game starts; only the two plain signs are drawn by hand.
    -->
    <svg id="icon-sheet" class="icon-sheet" width="0" height="0" aria-hidden="true" focusable="false">
      <symbol id="i-pause" viewBox="0 0 24 24">
        <rect x="4.500" y="3.500" width="6" height="17" rx="2.200" fill="#fff3d6" stroke="#3a1410" stroke-width="1.800" />
        <rect x="13.500" y="3.500" width="6" height="17" rx="2.200" fill="#fff3d6" stroke="#3a1410" stroke-width="1.800" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path
          d="M7.2 4.8v14.4a1 1 0 0 0 1.5.9l12-7.2a1 1 0 0 0 0-1.8l-12-7.2A1 1 0 0 0 8 4.8z"
          fill="#fff"
          stroke="#fff"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </symbol>
    </svg>

    <!--
      Everything drawn over the running game. It is switched off as one while a dialog is open,
      and stays out of sight until the game has its pictures (see main.ts).
    -->
    <div id="hud-layer" hidden>
      <div id="hud">
        <div id="wallet" class="chip">
          <svg class="coin" aria-hidden="true"><use href="#i-coin" /></svg>
          <span id="wallet-value">0</span>
        </div>
        <div id="branch" class="chip" hidden>
          <svg aria-hidden="true"><use href="#i-shop" /></svg>
          <span id="branch-number"></span>
        </div>
      </div>
      <div id="mission" class="chip" data-kind="serve" role="img" aria-label="">
        <span class="mission-badge">
          <svg class="for-serve" aria-hidden="true"><use href="#i-serve" /></svg>
          <svg class="for-earn" aria-hidden="true"><use href="#i-coin" /></svg>
        </span>
        <span class="mission-body">
          <span id="mission-text"></span>
          <span class="mission-bar"><i id="mission-fill"></i></span>
        </span>
        <svg class="mission-gift" aria-hidden="true"><use href="#i-gift" /></svg>
      </div>
      <!-- The opening loop as four pictures; it stands in the goal chip's place until it is learnt. -->
      <div id="tutorial" class="chip" role="img" aria-label="" hidden>
        <span class="tutorial-step" data-step="cut">
          <svg aria-hidden="true"><use href="#i-doner" /></svg>
          <svg class="tutorial-tick" aria-hidden="true"><use href="#i-check" /></svg>
        </span>
        <span class="tutorial-step" data-step="carry">
          <svg aria-hidden="true"><use href="#i-wrap" /></svg>
          <svg class="tutorial-tick" aria-hidden="true"><use href="#i-check" /></svg>
        </span>
        <span class="tutorial-step" data-step="collect">
          <svg aria-hidden="true"><use href="#i-coin" /></svg>
          <svg class="tutorial-tick" aria-hidden="true"><use href="#i-check" /></svg>
        </span>
        <span class="tutorial-step" data-step="buy">
          <svg aria-hidden="true"><use href="#i-upgrade" /></svg>
          <svg class="tutorial-tick" aria-hidden="true"><use href="#i-check" /></svg>
        </span>
      </div>
      <div id="rush" class="chip" role="img" aria-label="Rush hour" hidden>
        <svg aria-hidden="true"><use href="#i-rush" /></svg>
      </div>
      <div id="side">
        <div id="boost" class="chip" hidden>
          <b>2×</b>
          <svg aria-hidden="true"><use href="#i-clock" /></svg>
          <span id="boost-seconds"></span>
        </div>
        <button id="boost-button" type="button" aria-label="Watch a video to earn double coins" hidden>
          <svg class="boost-film" aria-hidden="true"><use href="#i-film" /></svg>
          <span class="boost-prize">
            <svg aria-hidden="true"><use href="#i-coin" /></svg>
            <b>2×</b>
          </span>
        </button>
      </div>
      <button id="pause-button" type="button" aria-label="Pause">
        <svg aria-hidden="true"><use href="#i-pause" /></svg>
      </button>
      <button id="camera-button" type="button" aria-label="Change camera view">
        <svg aria-hidden="true"><use href="#i-camera" /></svg>
      </button>
      <button id="sound-button" type="button" aria-label="Sound" aria-pressed="true">
        <svg class="sound-on" aria-hidden="true"><use href="#i-sound" /></svg>
        <svg class="sound-off" aria-hidden="true"><use href="#i-mute" /></svg>
      </button>
      <button id="shop-button" type="button" aria-label="Restyle the shop">
        <svg aria-hidden="true"><use href="#i-brush" /></svg>
      </button>
      <!-- Pointers to what is waiting off screen. Four are made here once and reused. -->
      <div id="edge-markers" aria-hidden="true">
        <div class="edge-marker" hidden><i class="edge-pointer"></i><svg><use href="#i-serve" /></svg></div>
        <div class="edge-marker" hidden><i class="edge-pointer"></i><svg><use href="#i-serve" /></svg></div>
        <div class="edge-marker" hidden><i class="edge-pointer"></i><svg><use href="#i-serve" /></svg></div>
        <div class="edge-marker" hidden><i class="edge-pointer"></i><svg><use href="#i-serve" /></svg></div>
      </div>
      <div id="drag-hint" hidden>
        <div id="drag-hand"><svg aria-hidden="true"><use href="#i-hand" /></svg></div>
      </div>
    </div>

    <div id="pause" class="overlay" role="dialog" aria-modal="true" aria-label="Game paused" hidden>
      <div class="card enter">
        <svg class="card-mascot" aria-hidden="true"><use href="#i-chef" /></svg>
        <span class="pause-mark" role="img" aria-label="Paused">
          <svg aria-hidden="true"><use href="#i-pause" /></svg>
        </span>
        <button id="pause-resume" class="go-button" type="button" aria-label="Resume">
          <svg aria-hidden="true"><use href="#i-play" /></svg>
        </button>
      </div>
    </div>
    <div id="unlock" class="overlay" role="dialog" aria-modal="true" aria-label="Something new unlocked" hidden>
      <div id="unlock-card" class="card enter">
        <div class="unlock-art">
          <svg class="spark spark-a" aria-hidden="true"><use href="#i-spark" /></svg>
          <svg class="spark spark-b" aria-hidden="true"><use href="#i-spark" /></svg>
          <canvas id="unlock-icon" width="256" height="256" role="img" aria-label=""></canvas>
          <span id="unlock-badge" hidden>
            <svg aria-hidden="true"><use href="#i-shop" /></svg>
            <span id="unlock-number"></span>
          </span>
        </div>
        <button id="unlock-continue" class="go-button" type="button" aria-label="Continue">
          <svg aria-hidden="true"><use href="#i-play" /></svg>
        </button>
      </div>
    </div>
    <div id="shop" class="overlay" role="dialog" aria-modal="true" aria-label="Restyle the shop" hidden>
      <div class="card enter">
        <div class="shop-main">
          <div id="shop-list"></div>
        </div>
        <button id="shop-close" class="go-button" type="button" aria-label="Back to the game">
          <svg aria-hidden="true"><use href="#i-play" /></svg>
        </button>
      </div>
    </div>
    <!-- The curtain drawn across the screen while the shop moves to a new district. -->
    <div id="wipe" aria-hidden="true" hidden>
      <svg aria-hidden="true"><use href="#i-shop" /></svg>
    </div>
    <div id="fatal" role="alert" hidden></div>
  </body>
</html>
